[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selgis"
version = "0.2.7.3"
description = "Universal Training Framework for PyTorch and HuggingFace Transformers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Selgis ML" }]
keywords = ["pytorch", "transformers", "training", "lora", "peft", "deep-learning", "llm", "agent-skills", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.30",
    "datasets",
    "accelerate>=0.21.0"
]
peft = ["peft>=0.5.0"]
llm = [
    "bitsandbytes>=0.41.0",
    "accelerate>=0.21.0",
    "scipy"
]
tracking = ["wandb"]
dev = ["pytest", "pytest-cov", "ruff>=0.1"]
all = [
    "transformers>=4.30",
    "datasets",
    "accelerate>=0.21.0",
    "peft>=0.5.0",
    "bitsandbytes>=0.41.0",
    "scipy",
    "wandb",
    "unsloth",
]
unsloth = ["unsloth"]

[project.scripts]
selgis = "selgis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["selgis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[project.urls]
Homepage = "https://github.com/Selgm-ofic/Selgis-ML"
Repository = "https://github.com/Selgm-ofic/Selgis-ML"
Issues = "https://github.com/Selgm-ofic/Selgis-ML/issues"
Documentation = "https://github.com/Selgm-ofic/Selgis-ML#readme"
